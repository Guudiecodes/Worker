    <script>
        function isNumeric(event) {
            var key = event.keyCode;
            return ((key >= 48 && key <= 57) || (key >= 96 && key <= 105));
        }

        const nameInput = document.getElementById('name');
        const numberInput = document.getElementById('number');
        const dateInput = document.getElementById('date');
        const cvvInput = document.getElementById('cvv');
        const cardName = document.getElementById('card-name');
        const cardNumber = document.querySelector('.card__number');
        const monthSpan = document.getElementById('month');
        const yearSpan = document.getElementById('year');
        const form = document.querySelector('.form');
        const alerts = document.querySelectorAll('.alert');

        function formatCardNumber(value) {
            return value.replace(/\W/gi, '').replace(/(.{4})/g, '$1 ').trim();
        }

        function formatDate(value) {
            return value.replace(/\W/gi, '').replace(/(.{2})/, '$1/');
        }

        nameInput.addEventListener('input', () => {
            cardName.textContent = nameInput.value || 'Mrs Kate Smith';
        });

        numberInput.addEventListener('input', () => {
            let val = numberInput.value.replace(/\D/g, '').slice(0,16);
            numberInput.value = formatCardNumber(val);
            cardNumber.textContent = formatCardNumber(val.padEnd(16, '*')) || '0000 0000 0000 0000';
        });

        dateInput.addEventListener('input', () => {
            let val = dateInput.value.replace(/\D/g, '').slice(0,4);
            dateInput.value = formatDate(val);
            if (val.length >= 2) {
                monthSpan.textContent = val.slice(0,2);
                yearSpan.textContent = val.slice(2) || 'YY';
            } else {
                monthSpan.textContent = 'MM';
                yearSpan.textContent = 'YY';
            }
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            let valid = true;
            alerts.forEach(a => a.classList.remove('visible'));
            if (!nameInput.value.trim()) {
                document.getElementById('alert-1').classList.add('visible');
                valid = false;
            }
            let num = numberInput.value.replace(/\D/g, '');
            if (num.length !== 16) {
                document.getElementById('alert-2').classList.add('visible');
                valid = false;
            }
            let date = dateInput.value.replace(/\D/g, '');
            const currentYear = new Date().getFullYear() % 100;
            const currentMonth = new Date().getMonth() + 1;
            if (date.length !== 4 || parseInt(date.slice(0,2)) < 1 || parseInt(date.slice(0,2)) > 12 ||
                (parseInt(date.slice(2)) < currentYear || (parseInt(date.slice(2)) === currentYear && parseInt(date.slice(0,2)) < currentMonth))) {
                document.getElementById('alert-3').classList.add('visible');
                valid = false;
            }
            let cvv = cvvInput.value;
            if (cvv.length < 3 || cvv.length > 4) {
                document.getElementById('alert-4').classList.add('visible');
                valid = false;
            }
            if (valid) {
                alert('Payment submitted!');
            }
        });

        function openWhatsApp() {
            // You can add additional logic here if needed, like tracking or animation
            // For now, it's handled by the link
        }

        // Attach event if needed
        document.getElementById('whatsapp-link').addEventListener('click', openWhatsApp);
    </script>
